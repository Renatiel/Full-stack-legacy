<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora JavaScript - freeCodeCamp</title>

  <!-- Script do Test Suite do freeCodeCamp -->
  <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>

  <!-- React & React DOM (Versão 17 para compatibilidade total) -->
  <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel para transpilar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #c2c8d1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator-container {
      width: 340px;
      background-color: #000000;
      border: 4px solid #47476b;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
    }

    .screen {
      background-color: #000000;
      color: #ffffff;
      text-align: right;
      padding: 10px;
      margin-bottom: 15px;
      word-wrap: break-word;
      word-break: break-all;
    }

    .formula-display {
      min-height: 20px;
      color: #f7a000;
      font-size: 0.95rem;
      font-family: monospace;
    }

    #display {
      font-size: 1.8rem;
      font-family: monospace;
      color: #ffffff;
      line-height: 1.2;
      margin-top: 4px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      height: 55px;
      background-color: #4d4d4d;
      color: #ffffff;
      border: 1px solid #1a1a1a;
      border-radius: 5px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      transition: background-color 0.1s ease;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:active {
      transform: scale(0.98);
    }

    #clear {
      background-color: #ac3939;
      grid-column: span 2;
    }

    #equals {
      background-color: #004466;
      grid-column: span 1;
      grid-row: span 2;
      height: 118px;
    }

    #zero {
      grid-column: span 2;
    }

    .operator {
      background-color: #666699;
    }

    .number {
      background-color: #333333;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const isOperator = /[x/+-]/;
    const endsWithOperator = /[x/+-]$/;
    const endsWithNegativeSign = /[x/+][-]$/;

    function Calculator() {
      const [currentVal, setCurrentVal] = useState("0");
      const [formula, setFormula] = useState("");
      const [evaluated, setEvaluated] = useState(false);

      const handleClear = () => {
        setCurrentVal("0");
        setFormula("");
        setEvaluated(false);
      };

      const handleNumbers = (e) => {
        const value = e.target.value;

        if (evaluated) {
          setCurrentVal(value);
          setFormula(value !== "0" ? value : "");
          setEvaluated(false);
          return;
        }

        if (currentVal === "0" && value === "0") return;

        if (currentVal === "0" || isOperator.test(currentVal)) {
          setCurrentVal(value);
        } else {
          setCurrentVal(currentVal + value);
        }

        if (currentVal === "0" && value === "0") {
          setFormula(formula === "" ? "0" : formula);
        } else if (/^0$/.test(formula)) {
          setFormula(value);
        } else {
          setFormula(formula + value);
        }
      };

      const handleDecimal = () => {
        if (evaluated) {
          setCurrentVal("0.");
          setFormula("0.");
          setEvaluated(false);
          return;
        }

        if (!currentVal.includes(".")) {
          if (isOperator.test(currentVal) || currentVal === "") {
            setCurrentVal("0.");
            setFormula(formula + "0.");
          } else {
            setCurrentVal(currentVal + ".");
            setFormula(formula + ".");
          }
        }
      };

      const handleOperators = (e) => {
        const value = e.target.value;

        if (evaluated) {
          setFormula(currentVal + value);
          setCurrentVal(value);
          setEvaluated(false);
          return;
        }

        setCurrentVal(value);

        if (endsWithOperator.test(formula)) {
          if (value === "-") {
            if (!formula.endsWith("-")) {
              setFormula(formula + value);
            }
          } else {
            if (endsWithNegativeSign.test(formula)) {
              setFormula(formula.slice(0, -2) + value);
            } else {
              setFormula(formula.slice(0, -1) + value);
            }
          }
        } else {
          setFormula(formula + value);
        }
      };

      const handleEvaluate = () => {
        if (evaluated) return;

        let expression = formula;

        while (endsWithOperator.test(expression)) {
          expression = expression.slice(0, -1);
        }

        if (!expression) return;

        expression = expression.replace(/x/g, "*");

        try {
          let result = Function(`'use strict'; return (${expression})`)();
          
          result = Math.round(10000000000 * result) / 10000000000;

          setCurrentVal(String(result));
          setFormula(expression.replace(/\*/g, "x") + "=" + result);
          setEvaluated(true);
        } catch (err) {
          setCurrentVal("Error");
          setFormula("");
          setEvaluated(true);
        }
      };

      return (
        <div className="calculator-container">
          <div className="screen">
            <div className="formula-display">{formula}</div>
            <div id="display">{currentVal}</div>
          </div>

          <div className="keypad">
            <button id="clear" onClick={handleClear} className="action">AC</button>
            <button id="divide" value="/" onClick={handleOperators} className="operator">/</button>
            <button id="multiply" value="x" onClick={handleOperators} className="operator">x</button>

            <button id="seven" value="7" onClick={handleNumbers} className="number">7</button>
            <button id="eight" value="8" onClick={handleNumbers} className="number">8</button>
            <button id="nine" value="9" onClick={handleNumbers} className="number">9</button>
            <button id="subtract" value="-" onClick={handleOperators} className="operator">-</button>

            <button id="four" value="4" onClick={handleNumbers} className="number">4</button>
            <button id="five" value="5" onClick={handleNumbers} className="number">5</button>
            <button id="six" value="6" onClick={handleNumbers} className="number">6</button>
            <button id="add" value="+" onClick={handleOperators} className="operator">+</button>

            <button id="one" value="1" onClick={handleNumbers} className="number">1</button>
            <button id="two" value="2" onClick={handleNumbers} className="number">2</button>
            <button id="three" value="3" onClick={handleNumbers} className="number">3</button>
            <button id="equals" onClick={handleEvaluate}>=</button>

            <button id="zero" value="0" onClick={handleNumbers} className="number">0</button>
            <button id="decimal" onClick={handleDecimal} className="number">.</button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<Calculator />, document.getElementById("root"));
  </script>
</body>
</html>
