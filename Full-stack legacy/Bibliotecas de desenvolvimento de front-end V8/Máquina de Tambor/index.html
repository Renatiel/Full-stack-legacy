<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Machine - freeCodeCamp</title>

  <!-- Script da Suite de Testes do freeCodeCamp -->
  <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>

  <!-- React & React DOM (Versão 17 para total compatibilidade com a suite de testes) -->
  <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel para transpilar JSX em tempo de execução -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2b303a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    /* Requisito História de Usuário #11: Centralizado horizontalmente */
    #drum-machine {
      background-color: #1a202c;
      border: 3px solid #f6ad55;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f6ad55;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Requisito História de Usuário #2: #display */
    #display {
      background-color: #2d3748;
      color: #48bb78;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;
      font-weight: bold;
      text-align: center;
      width: 100%;
      height: 50px;
      line-height: 50px;
      border-radius: 6px;
      border: 2px solid #4a5568;
      letter-spacing: 1px;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
    }

    /* Requisito História de Usuário #3: .drum-pad */
    .drum-pad {
      background-color: #4a5568;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: bold;
      height: 80px;
      border-radius: 8px;
      border: none;
      box-shadow: 0 4px 0 #2d3748;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      transition: all 0.1s ease;
    }

    .drum-pad:hover {
      background-color: #718096;
    }

    .drum-pad.active {
      background-color: #f6ad55;
      color: #1a202c;
      box-shadow: none;
      transform: translateY(4px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Início da Aplicação React em JSX -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Configuração dos 9 pads de bateria com áudios públicos e estáveis
    const drumPadsData = [
      {
        keyCode: 81,
        keyTrigger: 'Q',
        id: 'Heater-1',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Heater-1.mp3'
      },
      {
        keyCode: 87,
        keyTrigger: 'W',
        id: 'Heater-2',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Heater-2.mp3'
      },
      {
        keyCode: 69,
        keyTrigger: 'E',
        id: 'Heater-3',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Heater-3.mp3'
      },
      {
        keyCode: 65,
        keyTrigger: 'A',
        id: 'Heater-4',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Heater-6.mp3'
      },
      {
        keyCode: 83,
        keyTrigger: 'S',
        id: 'Clap',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Heater-6.mp3'
      },
      {
        keyCode: 68,
        keyTrigger: 'D',
        id: 'Open-HH',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Dsc_Oh.mp3'
      },
      {
        keyCode: 90,
        keyTrigger: 'Z',
        id: "Kick-n'-Hat",
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Kick_n_Hat.mp3'
      },
      {
        keyCode: 88,
        keyTrigger: 'X',
        id: 'Kick',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/RP4_KICK_1.mp3'
      },
      {
        keyCode: 67,
        keyTrigger: 'C',
        id: 'Closed-HH',
        url: 'https://cdn.freecodecamp.org/testable-projects-fcc/audio/Cev_Ut.mp3'
      }
    ];

    // Componente individual de cada Drum Pad
    function DrumPad({ pad, updateDisplay }) {
      const [isActive, setIsActive] = useState(false);

      const playSound = () => {
        const audio = document.getElementById(pad.keyTrigger);
        if (audio) {
          audio.currentTime = 0;
          audio.play();
          updateDisplay(pad.id);
          
          // Efeito visual de clique no botão
          setIsActive(true);
          setTimeout(() => setIsActive(false), 100);
        }
      };

      // Handler para capturar eventos de teclado (História #6)
      const handleKeyDown = (e) => {
        if (e.keyCode === pad.keyCode || e.key.toUpperCase() === pad.keyTrigger) {
          playSound();
        }
      };

      useEffect(() => {
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      return (
        <button
          className={`drum-pad ${isActive ? 'active' : ''}`}
          id={pad.id}
          onClick={playSound}
        >
          {pad.keyTrigger}
          <audio
            className="clip"
            id={pad.keyTrigger}
            src={pad.url}
          ></audio>
        </button>
      );
    }

    // Componente Principal
    function App() {
      const [displayText, setDisplayText] = useState('PRESS A KEY');

      const updateDisplay = (name) => {
        setDisplayText(name.replace(/-/g, ' '));
      };

      return (
        <div id="drum-machine">
          <div className="title">
            <i className="fa-solid fa-drum"></i> Drum Machine
          </div>

          <div id="display">{displayText}</div>

          <div className="pad-grid">
            {drumPadsData.map((pad) => (
              <DrumPad
                key={pad.id}
                pad={pad}
                updateDisplay={updateDisplay}
              />
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
